[package]
name = "m77rip-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
m77rip = { path = "..", features = ["c-reference"] }

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_decomp_corrupt"
path = "fuzz_targets/fuzz_decomp_corrupt.rs"
doc = false

[[bin]]
name = "fuzz_cpp_compress"
path = "fuzz_targets/fuzz_cpp_compress.rs"
doc = false

[workspace]
members = ["."]
