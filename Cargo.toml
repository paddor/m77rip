[workspace]
members = [".", "crates/core", "crates/encode", "crates/decode"]
exclude = ["bench"]
resolver = "3"

[package]
name = "m77rip"
description = "Fast, memory-safe Rust encoder and decoder for the misa77 compression format"
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/paddor/m77rip"
readme = "README.md"
keywords = ["compression", "misa77", "compress", "decompress", "decompression"]
categories = ["compression"]
include = [
    "src/**/*",
    "build.rs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "DESIGN.md",
    "SAFETY.md",
    "vendor/misa77_ffi.cpp",
    "vendor/misa77/LICENSE",
    "vendor/misa77/include/**/*",
    "vendor/misa77/src/**/*",
]

[features]
default = ["std"]
std = ["alloc", "m77rip-core/std", "m77rip-encode/std", "m77rip-decode/std"]
alloc = ["m77rip-decode/alloc"]
c-reference = ["dep:cc"]
paranoid = ["m77rip-core/paranoid", "m77rip-encode/paranoid", "m77rip-decode/paranoid"]

[dependencies]
m77rip-core = { version = "0.1.7", path = "crates/core", default-features = false }
m77rip-encode = { version = "0.1.7", path = "crates/encode", default-features = false }
m77rip-decode = { version = "0.1.7", path = "crates/decode", default-features = false }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
proptest = "1.0.0"
libc = "0.2"

[lints]
workspace = true

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A codec narrows and widens fixed-width fields everywhere on purpose.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Benchmark tools turn counters into floating-point rates.
cast_precision_loss = "allow"
# Hot-loop helpers need guaranteed inlining into SIMD dispatch.
inline_always = "allow"

[profile.release]
codegen-units = 1
opt-level = 3

[[example]]
name = "m77rip_bench"
required-features = ["c-reference"]

[[example]]
name = "profile_decompress"
required-features = ["c-reference"]
